<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-Нолики</title>
  <!-- Подключаем официальный скрипт Telegram -->
  <script src="https://telegram.org"></script>
  <style>
    body {
      margin: 0; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; background: #ffffff; color: #000000;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #181818; color: #ffffff; }
    }
    .status { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; max-width: 300px; margin: 0 auto;
    }
    .cell {
      aspect-ratio: 1; background: #2481cc; border-radius: 12px;
      font-size: 42px; font-weight: bold; color: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
    }
    .cell.taken { background: #1a5c91; cursor: not-allowed; }
    .btn-reset {
      margin-top: 25px; background: #e53935; color: white;
      border: none; padding: 10px 20px; border-radius: 8px;
      font-size: 16px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

<div class="status" id="statusText">Ход: X</div>
<div class="grid" id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>
<button class="btn-reset" id="resetBtn">Заново</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand(); // Разворачиваем на весь экран смартфона

  let currentTurn = 'X';
  let boardState = ["", "", "", "", "", "", "", "", ""];
  const statusText = document.getElementById('statusText');
  const cells = document.querySelectorAll('.cell');

  function checkWin() {
    const lines = [
      [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]
    ];
    for (let line of lines) {
      const [a, b, c] = line;
      if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
        return boardState[a];
      }
    }
    return boardState.includes("") ? null : "Ничья";
  }

  document.getElementById('board').addEventListener('click', (e) => {
    if (!e.target.classList.contains('cell') || e.target.classList.contains('taken')) return;
    
    const index = e.target.dataset.index;
    boardState[index] = currentTurn;
    e.target.textContent = currentTurn;
    e.target.classList.add('taken');

    const winner = checkWin();
    if (winner) {
      if (winner === "Ничья") {
        statusText.textContent = "Игра окончена: Ничья!";
      } else {
        statusText.textContent = `Победил игрок: ${winner}!`;
        // Отправляем результат боту в чат при победе!
        tg.sendData(`Победитель игры: ${winner}`);
      }
      boardState = boardState.map(() => "🔒"); // Блокируем поле
      return;
    }

    currentTurn = currentTurn === 'X' ? 'O' : 'X';
    statusText.textContent = `Ход: ${currentTurn}`;
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    boardState = ["", "", "", "", "", "", "", "", ""];
    currentTurn = 'X';
    statusText.textContent = "Ход: X";
    cells.forEach(cell => {
      cell.textContent = "";
      cell.classList.remove('taken');
    });
  });
</script>
</body>
</html>
